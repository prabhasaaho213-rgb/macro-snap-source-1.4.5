<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  width: 512px; 
  height: 512px; 
  display: flex; 
  align-items: center; 
  justify-content: center;
  background: transparent;
}
svg { width: 512px; height: 512px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">

      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />

  </defs>
  <!-- Background circle -->
  <circle cx="54" cy="54" r="44" fill="url(#bgGrad)"/>

  <path d="M37,69L37,39L46,50L54,39L54,69L49,69L49,50L46,55L43,50L43,69Z" fill="#FFFFFF" fill-opacity="0.15" transform="translate(0, 0.5)"/>

  <path d="M38,68L38,40L46,50L54,40L54,68L49,68L49,50L46,54L43,50L43,68Z" fill="#FFFFFF"/>

  <circle cx="63" cy="41" r="9" fill="#A7F3D0"/>
  <!-- Leaf accent inner -->
  <circle cx="63" cy="37" r="4.5" fill="#FFFFFF"/>
</svg>
</body>
</html>
