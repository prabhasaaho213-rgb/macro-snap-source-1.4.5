name: Build and Release AAB

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Set up Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "Installing NDK..."
            yes | sdkmanager "ndk;27.0.12077973" 2>/dev/null || true
          fi

      - name: Set up signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties << KEYEOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          KEYEOF
          ls -la android/app/upload-keystore.jks
          keytool -list -keystore android/app/upload-keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" | head -5
          echo "Signing configured successfully"

      - name: Verify signing config
        run: |
          if ! grep -q 'storeFile' android/key.properties; then
            echo "ERROR: key.properties missing storeFile"
            exit 1
          fi
          if [ ! -f android/app/upload-keystore.jks ]; then
            echo "ERROR: upload-keystore.jks not found"
            exit 1
          fi
          echo "All signing checks passed"

      - name: Get dependencies
        run: flutter pub get

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Verify AAB
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "AAB built successfully: $(ls -lh $AAB_PATH | awk '{print $5}')"
          else
            echo "ERROR: AAB not found at $AAB_PATH"
            exit 1
          fi

      - name: Rename AAB
        run: |
          mv build/app/outputs/bundle/release/app-release.aab macro-snap-${{ github.ref_name }}.aab
          echo "Release AAB: macro-snap-${{ github.ref_name }}.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-snap-aab-${{ github.ref_name }}
          path: macro-snap-${{ github.ref_name }}.aab
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: macro-snap-${{ github.ref_name }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
