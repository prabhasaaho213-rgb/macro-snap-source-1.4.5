name: Build and Release AAB

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Android SDK and NDK
        run: |
          flutter doctor -v
          # Accept all licenses
          yes | sdkmanager --licenses 2>/dev/null || true
          # Install the exact NDK version Flutter needs
          yes | sdkmanager --install "ndk;27.0.12077973" 2>/dev/null || true
          # Verify NDK is installed
          ls -la $ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/ | head -5
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Set up signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties << KEYEOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          KEYEOF
          keytool -list -keystore android/app/upload-keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" | head -3
          echo "Signing configured"

      - name: Get dependencies
        run: flutter pub get

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Verify AAB
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "AAB built: $(ls -lh $AAB_PATH | awk '{print $5}')"
          else
            echo "ERROR: AAB not found"
            exit 1
          fi

      - name: Rename AAB
        run: mv build/app/outputs/bundle/release/app-release.aab macro-snap-${{ github.ref_name }}.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-snap-aab-${{ github.ref_name }}
          path: macro-snap-${{ github.ref_name }}.aab
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: macro-snap-${{ github.ref_name }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
