name: Build and Release APK + AAB

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Android SDK and NDK
        run: |
          flutter doctor -v
          yes | sdkmanager --licenses 2>/dev/null || true
          yes | sdkmanager --install "ndk;27.0.12077973" 2>/dev/null || true

      - name: Set up signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=app/upload-keystore.jks\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" > android/key.properties
          echo "Signing configured"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk macro-snap-${{ github.ref_name }}.apk
          cp build/app/outputs/bundle/release/app-release.aab macro-snap-${{ github.ref_name }}.aab
          echo "APK: $(ls -lh macro-snap-${{ github.ref_name }}.apk | awk '{print $5}')"
          echo "AAB: $(ls -lh macro-snap-${{ github.ref_name }}.aab | awk '{print $5}')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macro-snap-${{ github.ref_name }}
          path: |
            macro-snap-${{ github.ref_name }}.apk
            macro-snap-${{ github.ref_name }}.aab
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macro-snap-${{ github.ref_name }}.apk
            macro-snap-${{ github.ref_name }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
