name: Build and Release APK

# IMPORTANT: This workflow builds a RELEASE APK signed with the upload keystore.
# Google Sign-In requires the signing certificate's SHA-1 to be registered in
# Firebase Console. The upload-keystore.jks SHA-1 (07:ED:F9:...) is registered.
# If you change the keystore, you MUST also update Firebase Console with the
# new SHA-1 or Google Sign-In will break.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Set up signing
        run: |
          # Decode the upload keystore from the secret
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          # Create key.properties for the release signing config
          cat > android/key.properties << KEYEOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          KEYEOF
          # Verify the keystore exists and is valid
          ls -la android/app/upload-keystore.jks
          keytool -list -keystore android/app/upload-keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" | head -5
          echo "Signing configured successfully"

      - name: Verify signing config
        run: |
          # Safety check: ensure we're NOT building with debug keystore
          if ! grep -q 'storeFile' android/key.properties; then
            echo "ERROR: key.properties missing storeFile"
            exit 1
          fi
          if [ ! -f android/app/upload-keystore.jks ]; then
            echo "ERROR: upload-keystore.jks not found"
            exit 1
          fi
          echo "All signing checks passed"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK built successfully: $(ls -lh $APK_PATH | awk '{print $5}')"
            # Verify it's signed with our keystore, not debug
            jarsigner -verify -verbose -certs "$APK_PATH" 2>&1 | head -10
          else
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk macro-snap-${{ github.ref_name }}.apk
          echo "Release APK: macro-snap-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-snap-${{ github.ref_name }}
          path: macro-snap-${{ github.ref_name }}.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: macro-snap-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
