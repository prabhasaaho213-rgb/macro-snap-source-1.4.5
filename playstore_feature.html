<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  min-height: 100vh; 
  background: #000;
}
.feature {
  width: 1024px;
  height: 500px;
  background: linear-gradient(135deg, #064E3B 0%, #059669 40%, #34D399 100%);
  position: relative;
  overflow: hidden;
  font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
  display: flex;
  align-items: center;
  padding: 0 80px;
}
/* Decorative circles */
.circle1 {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  top: -80px;
  right: -40px;
}
.circle2 {
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  bottom: -60px;
  right: 200px;
}
.circle3 {
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: rgba(167, 243, 208, 0.15);
  top: 60px;
  left: 50%;
}
/* Left side: text */
.text-area {
  position: relative;
  z-index: 2;
  flex: 1;
}
.app-name {
  font-size: 72px;
  font-weight: 800;
  color: white;
  letter-spacing: -2px;
  margin-bottom: 12px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.tagline {
  font-size: 28px;
  font-weight: 400;
  color: rgba(255,255,255,0.9);
  margin-bottom: 30px;
  line-height: 1.3;
}
.features {
  display: flex;
  gap: 30px;
}
.feature-item {
  display: flex;
  align-items: center;
  gap: 10px;
  color: rgba(255,255,255,0.85);
  font-size: 18px;
  font-weight: 500;
}
.feature-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
/* Right side: phone mockup */
.phone-area {
  position: relative;
  z-index: 2;
  width: 280px;
  height: 400px;
}
.phone {
  width: 260px;
  height: 380px;
  background: #1a1a2e;
  border-radius: 30px;
  border: 3px solid rgba(255,255,255,0.2);
  position: relative;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.phone-notch {
  width: 100px;
  height: 24px;
  background: #1a1a2e;
  border-radius: 0 0 16px 16px;
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
}
.phone-screen {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 20px;
}
.phone-title {
  font-size: 14px;
  color: white;
  font-weight: 700;
  margin-bottom: 16px;
}
.macro-ring {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 10px solid #059669;
  border-top-color: #34D399;
  border-right-color: #FBBF24;
  border-bottom-color: #EF4444;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}
.macro-ring-text {
  font-size: 20px;
  font-weight: 700;
  color: white;
}
.macro-bars {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bar {
  height: 10px;
  border-radius: 5px;
  background: rgba(255,255,255,0.1);
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 5px;
}
.bar-green { width: 75%; background: linear-gradient(90deg, #059669, #34D399); }
.bar-yellow { width: 60%; background: linear-gradient(90deg, #D97706, #FBBF24); }
.bar-red { width: 45%; background: linear-gradient(90deg, #DC2626, #EF4444); }
.bar-blue { width: 85%; background: linear-gradient(90deg, #2563EB, #60A5FA); }
.bar-label {
  font-size: 9px;
  color: rgba(255,255,255,0.5);
  display: flex;
  justify-content: space-between;
}
</style>
</head>
<body>
<div class="feature">
  <div class="circle1"></div>
  <div class="circle2"></div>
  <div class="circle3"></div>
  <div class="text-area">
    <div class="app-name">MacroSnap</div>
    <div class="tagline">AI-Powered Nutrition Tracker<br>for Indian Food</div>
    <div class="features">
      <div class="feature-item">
        <div class="feature-icon">📸</div>
        <span>AI Food Scan</span>
      </div>
      <div class="feature-item">
        <div class="feature-icon">📊</div>
        <span>Macro Tracking</span>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🔥</div>
        <span>Streak System</span>
      </div>
    </div>
  </div>
  <div class="phone-area">
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="phone-title">Today's Macros</div>
        <div class="macro-ring">
          <div class="macro-ring-text">1,850</div>
        </div>
        <div class="macro-bars">
          <div class="bar-label"><span>Protein</span><span>68g</span></div>
          <div class="bar"><div class="bar-fill bar-green"></div></div>
          <div class="bar-label"><span>Carbs</span><span>220g</span></div>
          <div class="bar"><div class="bar-fill bar-yellow"></div></div>
          <div class="bar-label"><span>Fats</span><span>52g</span></div>
          <div class="bar"><div class="bar-fill bar-red"></div></div>
          <div class="bar-label"><span>Fiber</span><span>28g</span></div>
          <div class="bar"><div class="bar-fill bar-blue"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
