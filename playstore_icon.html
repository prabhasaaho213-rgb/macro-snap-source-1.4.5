<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MacroSnap Icon Generator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 512px; height: 512px; overflow: hidden; background: #059669; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 512, H = 512;

// Rounded rectangle background
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Background gradient
const grad = ctx.createLinearGradient(0, 0, W, H);
grad.addColorStop(0, '#047857');
grad.addColorStop(0.5, '#059669');
grad.addColorStop(1, '#10B981');
roundRect(0, 0, W, H, 108);
ctx.fillStyle = grad;
ctx.fill();

// Inner lighter circle
ctx.beginPath();
ctx.arc(W/2, H/2, 160, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(52, 211, 153, 0.25)';
ctx.fill();

// Leaf/magnifier circle (top right)
ctx.beginPath();
ctx.arc(370, 140, 40, 0, Math.PI * 2);
ctx.fillStyle = '#A7F3D0';
ctx.fill();

// White dot inside leaf
ctx.beginPath();
ctx.arc(370, 140, 20, 0, Math.PI * 2);
ctx.fillStyle = '#FFFFFF';
ctx.fill();

// Letter M
ctx.fillStyle = '#FFFFFF';
ctx.font = '900 220px "Segoe UI", "Helvetica Neue", Arial, sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.shadowColor = 'rgba(0,0,0,0.15)';
ctx.shadowBlur = 20;
ctx.shadowOffsetY = 4;
ctx.fillText('M', W/2 - 10, H/2 + 20);
ctx.shadowColor = 'transparent';

// Signal it's done
window._iconDone = true;
</script>
</body>
</html>
